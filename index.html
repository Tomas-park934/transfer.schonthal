<html>
    <div class="carrusel-contenedor">
        <div class="carrusel" id="carrusel">
        
          <div class="diapositiva">
            <img src="messi2.png" alt="lionel-messi">
          </div>
          <div class="diapositiva">
            <img src="lamine2.png" alt="lamine-yamal">
          </div>
            <div class="diapositiva">
            <img src="harry kane2.jpg" alt="harry-kane">
          </div>
          <div class="diapositiva">
            <img src="messipremio.png" alt="lionel-messi">
          </div>
          
        </div>
        <button class="boton-carrusel anterior" onclick="mover(-1)">&#10094;</button>
        <button class="boton-carrusel siguiente" onclick="mover(1)">&#10095;</button>
      </div>


       <script>
    let indiceActual = 0;

    function mover(direccion) {
      const diapositivas = document.querySelectorAll('.diapositiva');
      const totalDiapositivas = diapositivas.length;
     
      indiceActual += direccion;

      if (indiceActual >= totalDiapositivas) {
        indiceActual = 0;
      } else if (indiceActual < 0) {
        indiceActual = totalDiapositivas - 1;
      }

      const carrusel = document.getElementById('carrusel');
      carrusel.style.transform = `translateX(-${indiceActual * 100}%)`;
    }
  </script>
