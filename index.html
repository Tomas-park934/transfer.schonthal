<img src="transfer.png" alt="Mercado de Fichajes 26"> 

<h2>Este es el mercado que te dirá las últimas noticias de fichajes en el fútbol internacional</h2>

     <div class="carruseles">

    <div class="carrusel-contenedor">
      <div class="carrusel">
        <div class="diapositiva"><img src="messi2.png" alt="messi-y-ronaldo"></div>
        <div class="diapositiva"><img src="lamine2.png" alt="lamine-yamal"></div>
        <div class="diapositiva"><img src="harry.jfif" alt="harry-kane"></div>
      </div>
      <button class="boton-carrusel anterior" onclick="mover(this, -1)">&#10094;</button>
      <button class="boton-carrusel siguiente" onclick="mover(this, 1)">&#10095;</button>
    </div>

    <div class="carrusel-contenedor">
      <div class="carrusel">
        <div class="diapositiva"><img src="psg.png" alt="entrenadores"></div>
        <div class="diapositiva"><img src="kimine.png" alt="yamal-y-mbappe"></div>
        <div class="diapositiva"><img src="judeb.png" alt="bellingham"></div>
      </div>
      <button class="boton-carrusel anterior" onclick="mover(this, -1)">&#10094;</button>
      <button class="boton-carrusel siguiente" onclick="mover(this, 1)">&#10095;</button>
    </div>

  </div>

  <script>
    function mover(boton, direccion) {
      const contenedor = boton.closest('.carrusel-contenedor');
      const carrusel = contenedor.querySelector('.carrusel');
      const total = carrusel.querySelectorAll('.diapositiva').length;

      let indice = Number(contenedor.dataset.indice || 0) + direccion;

      if (indice >= total) indice = 0;
      else if (indice < 0) indice = total - 1;

      contenedor.dataset.indice = indice;
      carrusel.style.transform = `translateX(-${indice * 100}%)`;
    }
  </script>

</body>
</html>
